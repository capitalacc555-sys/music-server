<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NightWave</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="/img/expirada-logo.png" />
</head>
<body>
  <div id="brand-intro" class="brand-intro" aria-hidden="true">
    <div class="brand-intro-glow"></div>
    <img id="brand-intro-logo" class="brand-intro-logo" alt="logo" />
    <div id="brand-intro-name" class="brand-intro-name">NightWave</div>
  </div>

  <div id="app-bg-layer" class="app-bg-layer"></div>
  <video id="app-bg-video" class="app-bg-video" autoplay muted loop playsinline></video>

  <div id="app">

    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" id="brand-mark"></span>
        <img id="brand-logo-img" class="brand-logo-img" src="/img/expirada-logo.png" alt="logo" />
        <span class="brand-name" id="brand-name">NightWave</span>
      </div>

      <nav class="main-nav">
        <button class="nav-item active" data-view="home">
          <svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v8h6v-6h2v6h6v-8h3z"/></svg>
          Início
        </button>
        <button class="nav-item" data-view="online">
          <svg viewBox="0 0 24 24"><path d="M5 18a7 7 0 1 1 14 0"/><path d="M8 18a3 3 0 0 1 6 0"/><circle cx="12" cy="8" r="3"/></svg>
          Online
        </button>
        <button class="nav-item" data-view="library">
          <svg viewBox="0 0 24 24"><path d="M4 4h4v16H4zM10 8h4v12h-4zM16 6h4v14h-4z"/></svg>
          Sua Biblioteca
        </button>
        <button class="nav-item" data-view="playlists">
          <svg viewBox="0 0 24 24"><path d="M4 7h12M4 12h12M4 17h7M17 17h3M18.5 15.5v3M17 17h3"/></svg>
          Playlists
        </button>
      </nav>

      <button id="btn-settings" class="settings-btn">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 0 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 0 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 0 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 0 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></svg>
        Configurações
      </button>
    </aside>

    <main class="content">
      <header class="topbar">
        <div class="topbar-search">
          <input id="global-search" type="text" placeholder="O que você quer ouvir?" />
        </div>
      </header>

      <div id="view-root" class="view-root"></div>
    </main>

    <footer class="player-bar">
      <div class="player-track-info">
        <img id="now-cover" class="now-cover" src="" alt="" />
        <div class="now-text">
          <div id="now-title" class="now-title">Nenhuma faixa tocando</div>
          <div id="now-artist" class="now-artist">—</div>
        </div>
        <button id="now-fav" class="icon-btn fav-btn" title="Favoritar">
          <svg viewBox="0 0 24 24"><path d="M12 21s-6.7-4.35-9.3-8.14C1 10.3 1.5 6.9 4.3 5.3 6.6 4 9.3 4.7 11 6.6c.4.4.7.8 1 1.2.3-.4.6-.8 1-1.2 1.7-1.9 4.4-2.6 6.7-1.3 2.8 1.6 3.3 5 1.6 7.56C18.7 16.65 12 21 12 21z"/></svg>
        </button>
      </div>

      <div class="player-controls">
        <div class="control-buttons">
          <button id="btn-shuffle" class="icon-btn" title="Aleatório">
            <svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
          </button>
          <button id="btn-prev" class="icon-btn" title="Anterior">
            <svg viewBox="0 0 24 24"><path d="M19 20 9 12l10-8v16zM5 19V5"/></svg>
          </button>
          <button id="btn-play" class="icon-btn play-btn" title="Tocar/Pausar">
            <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg id="icon-pause" viewBox="0 0 24 24" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
          </button>
          <button id="btn-next" class="icon-btn" title="Próxima">
            <svg viewBox="0 0 24 24"><path d="M5 4l10 8-10 8V4zM19 5v14"/></svg>
          </button>
          <button id="btn-repeat" class="icon-btn" title="Repetir">
            <svg viewBox="0 0 24 24"><path d="M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"/></svg>
          </button>
        </div>
        <div class="seek-row">
          <span id="time-current" class="time-label">0:00</span>
          <input id="seek" type="range" min="0" max="100" value="0" />
          <span id="time-total" class="time-label">0:00</span>
        </div>
      </div>

      <div class="player-extra">
        <button id="btn-eq" class="icon-btn" title="Equalizador">
          <svg viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/></svg>
        </button>
        <svg viewBox="0 0 24 24" class="volume-icon"><path d="M11 5 6 9H2v6h4l5 4V5zM19 5a9 9 0 0 1 0 14M15.5 8.5a5 5 0 0 1 0 7"/></svg>
        <input id="volume" type="range" min="0" max="100" value="80" />
      </div>
    </footer>

    <audio id="audio-el" preload="metadata"></audio>
  </div>

  <div id="modal-root"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
